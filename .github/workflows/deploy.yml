name: Deploy to GitHub Pages

# Hosting is on Vercel (auto-deploys on push). This GitHub Pages workflow is kept
# as an optional alternative and runs ONLY when triggered by hand
# (Actions → Deploy to GitHub Pages → Run workflow). To make Pages the automatic
# host instead, add `push: { branches: [main] }` back here and enable Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let a new push cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set repository Variables (Settings → Secrets and variables → Actions → Variables)
      # SITE_URL / BASE_PATH to override these — e.g. for a custom domain:
      #   SITE_URL=https://hub.example.com   BASE_PATH=/
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
      # Phase 4 portal (public values only). Leave unset to ship a public-only site.
      # NEVER add the service_role key here or anywhere in CI.
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build # also runs Pagefind indexing into dist/pagefind

      - name: Check internal links
        run: npm run check:links

      - name: Facilitator-content test
        run: npm run test:facilitator

      - name: No service_role key in build
        run: npm run check:secrets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
